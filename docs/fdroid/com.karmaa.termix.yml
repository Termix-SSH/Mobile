Categories:
  - Development
  - Remote Access
License: Apache-2.0
AuthorName: Termix
WebSite: https://termix.site
SourceCode: https://github.com/Termix-SSH/Mobile
IssueTracker: https://github.com/Termix-SSH/Mobile/issues
Changelog: https://github.com/Termix-SSH/Mobile/blob/HEAD/CHANGELOG.md
Donate: https://donate.termix.site/

AutoName: Termix

RepoType: git
Repo: https://github.com/Termix-SSH/Mobile.git

Builds:
  - versionName: 2.0.0
    versionCode: 200001
    commit: 487cb46207355874995149ad43606b90890b201c
    timeout: 7200
    sudo:
      - apt-get update
      - apt-get install -y curl git unzip xz-utils build-essential cmake ninja-build
      - curl -sSLo /tmp/node.tar.xz https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
      - echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v24.22.1-linux-x64/bin/* /usr/local/bin/
      - curl -sSLo /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
      - echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz"
        | sha256sum -c -
      - tar -xJf /tmp/zig.tar.xz -C /opt
      - ln -sf /opt/zig-x86_64-linux-0.15.2/zig /usr/local/bin/zig
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export TERMIX_FDROID=1
      - export TERMIX_FDROID_VERCODE=$$VERCODE$$
      - RUSTUP=https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu
      - curl -sSLo /tmp/rustup-init $RUSTUP/rustup-init
      - echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  /tmp/rustup-init"
        | sha256sum -c -
      - chmod +x /tmp/rustup-init
      - /tmp/rustup-init -y --default-toolchain 1.99.1
      - . "$HOME/.cargo/env"
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - npm ci
      - node scripts/prepare-fdroid.cjs
      - node scripts/check-fdroid.cjs
      - sh scripts/build-native-fdroid.sh fetch
    scanignore:
      - node_modules/*/android/build.gradle
      - node_modules/@*/*/android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/react-native/ReactAndroid/hermes-engine/build.gradle.kts
      - node_modules/hermes-compiler
      - node_modules/expo/template.tgz
    scandelete:
      - modules/termix-ssh/rust/target
      - modules/termix-terminal/ios
      - node_modules/esbuild/bin
      - node_modules/@esbuild
      - node_modules/tsx/node_modules
      - node_modules/@esbuild-kit/core-utils/node_modules
      - node_modules/@termix-ssh/plugin-sdk/node_modules/esbuild
      - node_modules/@termix-ssh/plugin-sdk/node_modules/@esbuild
      - node_modules/fb-dotslash/bin
      - node_modules/zxing-wasm/dist
      - node_modules/expo-sqlite/android/libsql
      - node_modules/expo-sqlite/android/vec
      - node_modules/expo-sqlite/ios
      - node_modules/expo-sqlite/web/wa-sqlite
      - node_modules/@expo/expo-modules-macros-plugin/apple
      - node_modules/react-native/React/I18n
      - node_modules/unimodules-app-loader/local-maven-repo
    build:
      - export TERMIX_FDROID=1
      - export TERMIX_FDROID_VERCODE=$$VERCODE$$
      - . "$HOME/.cargo/env"
      - sh scripts/build-native-fdroid.sh build
      - npx expo prebuild --platform android --no-install
      - cd android
      - ./gradlew assembleRelease
    ndk: 27.1.12297006

