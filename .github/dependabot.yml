version: 2
updates:
  # npm waits 3 days after a release. Minor and patch updates come as one
  # weekly PR, each major as its own PR. Security updates skip the wait.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/store"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    # Expo SDK packages move together through npx expo install --fix.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # react-native ships a renderer for one exact React version.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "jest-expo"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-expo"
        update-types:
          - "version-update:semver-major"
      # jest-expo is built on a fixed Jest major.
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
      # Native modules must match the Expo SDK, so they also move with
      # npx expo install --fix.
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      # NativeWind 4 needs Tailwind 3.
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      # Plugin frames share these with core, so majors follow core.
      - dependency-name: "i18next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-i18next"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint and eslint-plugin-react are not ready for these yet.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore

  # Keeps the SHA pinned actions current. The cooldown skips releases younger
  # than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # Base images are pinned by digest. This refreshes the digest and tag.
  - package-ecosystem: docker
    directories:
      - "/modules/termix-ssh/test-server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: chore
