version: 2
updates:
  # npm waits 3 days after a release. Minor and patch updates come as one
  # weekly PR, each major as its own PR. Security updates skip the wait.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/store"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    # Expo SDK packages move together through npx expo install --fix.
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: chore

  # Keeps the SHA pinned actions current. The cooldown skips releases younger
  # than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # Base images are pinned by digest. This refreshes the digest and tag.
  - package-ecosystem: docker
    directories:
      - "/modules/termix-ssh/test-server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker:
        patterns:
          - "*"
    commit-message:
      prefix: chore
