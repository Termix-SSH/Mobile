name: CI

on:
  pull_request:
    branches:
      - main
      - "dev-*"
  push:
    branches:
      - main
      - "dev-*"

jobs:
  check:
    name: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify RDP credential prompts
        run: npm run verify:rdp-login

      - name: Verify server feature gating
        run: npm run verify:server-features

      - name: Verify 2.9 API compatibility
        run: npm run verify:api-compat

      - name: Verify app link intent filters
        run: npm run verify:oidc-callback-intent-filter

      - name: Verify widget contract
        run: npm run verify:widget-contract

      - name: Verify Android network security config
        run: npm run verify:android-network-security

      - name: Verify remote desktop resolution
        run: node scripts/verify-remote-resolution.cjs

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --pretty false

      - name: Verify remote desktop viewport
        run: node scripts/verify-remote-viewport.cjs

      - name: Verify terminal WebSocket authentication
        run: npm run verify:terminal-websocket-auth

      - name: Test the release notes builder
        run: node scripts/generate-release-body.test.cjs

      - name: Validate Expo config
        run: npx expo config --type public --json > /tmp/expo-config.json
