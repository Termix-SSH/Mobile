name: CI

on:
  pull_request:
    branches:
      - main
      - "dev-*"
  push:
    branches:
      - main
      - "dev-*"

permissions: {}

jobs:
  check:
    name: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Lockfile lint
        uses: Termix-SSH/Termix-Registry/.github/actions/supply-chain@main
        with:
          osv: "false"
          aliases: >-
            @jest/react-is-18:react-is
            @jest/react-is-19:react-is

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --pretty false

      - name: Test
        run: npm test -- --ci

      # The plugin view policy shares its core list with the web shell.
      - name: Frame policy matches core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh api --paginate repos/Termix-SSH/Termix/branches --jq '.[].name' \
            | grep -E '^dev-[0-9]+\.[0-9]+\.[0-9]+$' | sort -t- -k2 -V | tail -n 1)"
          echo "core branch: $branch"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/Termix-SSH/Termix/contents/src/ui/plugin-host/frames/frame-core-rules.json?ref=$branch" \
            > "$RUNNER_TEMP/core-rules.json"
          node scripts/sync-frame-policy.cjs --check "$RUNNER_TEMP/core-rules.json"

      - name: Validate Expo config
        run: npx expo config --type public --json > /tmp/expo-config.json
