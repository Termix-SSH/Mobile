name: Build and Push App
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform to build for
        default: "both"
        required: true
        options:
          - both
          - apple
          - android
      action:
        type: choice
        description: What to do with the built app
        default: "file"
        required: true
        options:
          - none
          - file
          - release
          - submit
jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'apple' && 'blacksmith-6vcpu-macos-latest' || 'blacksmith-8vcpu-ubuntu-2404' }}
    strategy:
      matrix:
        platform: ${{ github.event.inputs.platform == 'both' && fromJSON('["apple", "android"]') || fromJSON(format('["{0}"]', github.event.inputs.platform)) }}
        node: [20.x]
    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v7
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest

      - name: Install dependencies
        run: npm ci

      # Userspace Tailscale native libraries must exist before native packaging.
      - name: Setup Go
        if: matrix.platform == 'apple' || matrix.platform == 'android'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: modules/termix-tailscale/native/go.sum

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        if: matrix.platform == 'android'
        env:
          ANDROID_NDK_VERSION: "27.1.12297006"
          CMAKE_VERSION: "3.22.1"
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${SDK_ROOT}/cmake/${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Xcode
        if: matrix.platform == 'apple'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Termix Tailscale iOS archive
        if: matrix.platform == 'apple'
        run: |
          set -euo pipefail
          make -C modules/termix-tailscale/native ios
          test -f modules/termix-tailscale/ios/lib/libtermix_ts.a
          test -f modules/termix-tailscale/ios/lib/termix_ts.h
          nm -gU modules/termix-tailscale/ios/lib/libtermix_ts.a | grep -E 'TermixTS_(IsAvailable|Configure|Up|StartForward|Close)'
          ls -lh modules/termix-tailscale/ios/lib/

      - name: Build Termix Tailscale Android library
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          make -C modules/termix-tailscale/native android
          test -f modules/termix-tailscale/android/src/main/jniLibs/arm64-v8a/libtermix_ts.so
          test -f modules/termix-tailscale/android/src/main/jniLibs/termix_ts.h
          ls -lh modules/termix-tailscale/android/src/main/jniLibs/arm64-v8a/

      - name: Validate EAS configuration
        run: |
          echo "EAS configuration:"
          cat eas.json
          echo "Validating configuration..."
          EAS_PLATFORM=${{ matrix.platform == 'apple' && 'ios' || matrix.platform }}
          eas build:configure --platform "$EAS_PLATFORM" --non-interactive

      - name: Build app
        run: |
          if [ "${{ github.event.inputs.action }}" = "submit" ]; then
            PROFILE="production"
          else
            PROFILE="preview"
          fi

          echo "Building for platform: ${{ matrix.platform }}"
          echo "Using profile: $PROFILE"

          mkdir -p build-artifacts

          VERSION=$(node -p "require('./app.json').expo.version")
          echo "App version: $VERSION"

          EAS_PLATFORM=${{ matrix.platform == 'apple' && 'ios' || matrix.platform }}

          eas build --local \
            --non-interactive \
            --platform=$EAS_PLATFORM \
            --profile=$PROFILE

          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "Searching for Android build artifacts..."

            APK_FILE=$(find . -maxdepth 1 -type f -name "build-*.apk" -print 2>/dev/null | sed -n '1p')

            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" "build-artifacts/termix_android.apk"
              echo "Copied to build-artifacts/termix_android.apk"
            else
              echo "Trying /tmp search..."
              APK_FILE=$(find /tmp -type f -name "app-release.apk" 2>/dev/null | grep "eas-build-local-nodejs" | sed -n '1p' || true)

              if [ -n "$APK_FILE" ]; then
                echo "Found APK in /tmp: $APK_FILE"
                cp "$APK_FILE" "build-artifacts/termix_android.apk"
              else
                echo "ERROR: APK not found after build"
                ls -la . | grep -E '\.apk|build-'
                exit 1
              fi
            fi

            if [ "$PROFILE" = "production" ]; then
              AAB_FILE=$(find . -maxdepth 1 -type f -name "build-*.aab" -print 2>/dev/null | sed -n '1p')

              if [ -n "$AAB_FILE" ]; then
                cp "$AAB_FILE" "build-artifacts/termix_android.aab"
              else
                AAB_FILE=$(find /tmp -type f -name "app-release.aab" 2>/dev/null | grep "eas-build-local-nodejs" | sed -n '1p' || true)
                if [ -n "$AAB_FILE" ]; then
                  echo "Found AAB in /tmp: $AAB_FILE"
                  cp "$AAB_FILE" "build-artifacts/termix_android.aab"
                else
                  echo "ERROR: AAB not found after production build"
                  exit 1
                fi
              fi
            fi
          elif [ "${{ matrix.platform }}" = "apple" ]; then
            echo "Searching for iOS build artifacts..."

            IPA_FILE=$(find . -maxdepth 1 -type f -name "build-*.ipa" -print 2>/dev/null | sed -n '1p')

            if [ -n "$IPA_FILE" ]; then
              echo "Found IPA in project root: $IPA_FILE"
              cp "$IPA_FILE" "build-artifacts/termix_ios.ipa"
              echo "Copied to build-artifacts/termix_ios.ipa"
            else
              IPA_FILE=$(find . -type f -name "*.ipa" -not -path "*/node_modules/*" -print 2>/dev/null | sed -n '1p')

              if [ -n "$IPA_FILE" ]; then
                echo "Found IPA: $IPA_FILE"
                cp "$IPA_FILE" "build-artifacts/termix_ios.ipa"
              else
                echo "ERROR: IPA not found after build"
                ls -la . | grep -E '\.ipa|build-'
                exit 1
              fi
            fi
          fi
        env:
          EAS_SKIP_AUTO_FINGERPRINT: 1

      - name: Verify build artifacts
        id: detect-artifacts
        run: |
          echo "=== Build Artifacts ==="

          if [ -d "build-artifacts" ]; then
            echo "Contents of build-artifacts/:"
            ls -lh build-artifacts/ 2>/dev/null || echo "Directory exists but is empty"

            ARTIFACT_COUNT=$(ls -1 build-artifacts/ 2>/dev/null | wc -l)
            echo ""
            echo "Total artifacts: $ARTIFACT_COUNT"
          else
            echo "Warning: build-artifacts directory not found"
            mkdir -p build-artifacts
            ARTIFACT_COUNT=0
          fi

          echo "artifact_count=$ARTIFACT_COUNT" >> $GITHUB_OUTPUT

      - name: Submit to App Store
        if: ${{ github.event.inputs.action == 'submit' }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")

          if [ "${{ matrix.platform }}" = "android" ]; then
            BUILD_FILE="build-artifacts/termix_android.aab"
            if [ -f "$BUILD_FILE" ]; then
              echo "Using AAB for Play Store submission: $BUILD_FILE"
            else
              echo "ERROR: AAB not found for production submission"
              echo "Play Store requires AAB format for submissions"
              exit 1
            fi
          else
            BUILD_FILE="build-artifacts/termix_ios.ipa"
          fi

          if [ -n "$BUILD_FILE" ] && [ -f "$BUILD_FILE" ]; then
            echo "Submitting file: $BUILD_FILE"
            EAS_PLATFORM=${{ matrix.platform == 'apple' && 'ios' || matrix.platform }}
            eas submit -p $EAS_PLATFORM --profile production --path "$BUILD_FILE"
          else
            echo "No build file found to submit"
            exit 1
          fi

      - name: Upload Android APK
        if: ${{ github.event.inputs.action == 'file' && matrix.platform == 'android' }}
        uses: actions/upload-artifact@v4
        with:
          name: termix_android
          path: build-artifacts/termix_android.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload iOS IPA
        if: ${{ github.event.inputs.action == 'file' && matrix.platform == 'apple' }}
        uses: actions/upload-artifact@v4
        with:
          name: termix_ios_universal
          path: build-artifacts/termix_ios.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.action == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.TERMIX_RELEASE_TOKEN }}
        run: |
          echo "Fetching latest release from Termix-SSH/Mobile..."
          MOBILE_RELEASE=$(gh release list --repo Termix-SSH/Mobile --limit 1 --json tagName,name,isLatest -q '.[0]')

          if [ -z "$MOBILE_RELEASE" ]; then
            echo "ERROR: No releases found in Termix-SSH/Mobile"
            exit 1
          fi

          MOBILE_TAG=$(echo "$MOBILE_RELEASE" | jq -r '.tagName')
          MOBILE_NAME=$(echo "$MOBILE_RELEASE" | jq -r '.name')
          MOBILE_URL="https://github.com/Termix-SSH/Mobile/releases/tag/$MOBILE_TAG"

          echo "Latest Mobile release: $MOBILE_NAME ($MOBILE_TAG)"

          if [ "${{ matrix.platform }}" = "android" ]; then
            APK_FILE="build-artifacts/termix_android.apk"
            if [ -f "$APK_FILE" ]; then
              echo "Uploading $APK_FILE to Termix-SSH/Mobile..."
              gh release upload "$MOBILE_TAG" \
                "$APK_FILE" \
                --repo Termix-SSH/Mobile \
                --clobber
              echo "✓ Android APK uploaded to Termix-SSH/Mobile"
            else
              echo "ERROR: Android APK not found: $APK_FILE"
              exit 1
            fi
          elif [ "${{ matrix.platform }}" = "apple" ]; then
            IPA_FILE="build-artifacts/termix_ios.ipa"
            if [ -f "$IPA_FILE" ]; then
              echo "Uploading $IPA_FILE to Termix-SSH/Mobile..."
              gh release upload "$MOBILE_TAG" \
                "$IPA_FILE" \
                --repo Termix-SSH/Mobile \
                --clobber
              echo "✓ iOS IPA uploaded to Termix-SSH/Mobile"
            else
              echo "ERROR: iOS IPA not found: $IPA_FILE"
              exit 1
            fi
          fi

          echo ""
          echo "Build uploaded to: $MOBILE_URL"
