name: Build and Push App
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platform to build for
        default: "both"
        required: true
        options:
          - both
          - apple
          - android
      action:
        type: choice
        description: What to do with the built app
        default: "file"
        required: true
        options:
          - none
          - file
          - release
          - submit
      channel:
        type: choice
        description: Beta goes to TestFlight and the Play beta track, and the GitHub release is a pre-release
        default: "stable"
        required: true
        options:
          - stable
          - beta

permissions: {}

jobs:
  release:
    name: Create the GitHub release
    if: ${{ github.event.inputs.action == 'release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Drafts, uploads and publishes this repo's GitHub release.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - name: Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the draft release from CHANGELOG.md
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v$VERSION"
          node scripts/generate-release-body.cjs --version "$VERSION" > RELEASE_BODY.md
          cat RELEASE_BODY.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating its notes"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file RELEASE_BODY.md
          else
            echo "Creating draft release $TAG"
            PRERELEASE=()
            if [ "$CHANNEL" = "beta" ]; then PRERELEASE=(--prerelease); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${PRERELEASE[@]}" \
              --title "v$VERSION" --target "$GITHUB_SHA" --notes-file RELEASE_BODY.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.platform }}
    needs: [release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ${{ matrix.platform == 'apple' && 'blacksmith-6vcpu-macos-27' || 'blacksmith-8vcpu-ubuntu-2404' }}
    # Drafts, uploads and publishes this repo's GitHub release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.event.inputs.platform == 'both' && fromJSON('["apple", "android"]') || fromJSON(format('["{0}"]', github.event.inputs.platform)) }}
    env:
      ACTION: ${{ inputs.action }}
      CHANNEL: ${{ inputs.channel }}
      PLATFORM: ${{ matrix.platform }}
      EAS_PLATFORM: ${{ matrix.platform == 'apple' && 'ios' || matrix.platform }}
    steps:
      - name: Setup repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches in a job that builds release apps.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # The iPhone Duo fold APIs need the iOS 27.1 SDK. Older Xcode still builds, letterboxed.
      - name: Setup Xcode 27.1
        id: xcode
        if: ${{ matrix.platform == 'apple' }}
        continue-on-error: true
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.1"

      - name: Setup newest Xcode
        if: ${{ matrix.platform == 'apple' && steps.xcode.outcome == 'failure' }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # EAS checks the signing identity with find-identity -v, which needs Apple's
      # intermediate certificates. The macOS 27 image doesn't ship them.
      - name: Install Apple signing intermediates
        if: ${{ matrix.platform == 'apple' }}
        run: |
          for cert in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6 DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$cert.cer" "https://www.apple.com/certificateauthority/$cert.cer"
            sudo security add-certificates -k /Library/Keychains/System.keychain "$RUNNER_TEMP/$cert.cer" || true
          done

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: 27.7.2
          eas-cache: false
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate EAS configuration
        run: |
          echo "EAS configuration:"
          cat eas.json
          echo "Validating configuration..."
          eas build:configure --platform "$EAS_PLATFORM"

      - name: Build app
        run: |
          if [ "$ACTION" = "submit" ]; then
            PROFILE="production"
          else
            PROFILE="preview"
          fi

          echo "Building for platform: $PLATFORM"
          echo "Using profile: $PROFILE"

          mkdir -p build-artifacts

          VERSION=$(node -p "require('./app.json').expo.version")
          echo "App version: $VERSION"

          if [ -n "$ASC_API_KEY" ]; then
            printf '%s\n' "$ASC_API_KEY" > "$EXPO_ASC_API_KEY_PATH"
            chmod 600 "$EXPO_ASC_API_KEY_PATH"
          else
            unset EXPO_ASC_API_KEY_PATH EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID
          fi

          eas build --local \
            --non-interactive \
            --platform="$EAS_PLATFORM" \
            --profile="$PROFILE"

          if [ "$PLATFORM" = "android" ]; then
            echo "Searching for Android build artifacts..."

            APK_FILE=$(find . -maxdepth 1 -type f -name "build-*.apk" 2>/dev/null | head -1)

            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" "build-artifacts/termix_android.apk"
              echo "Copied to build-artifacts/termix_android_universal_${VERSION}.apk"
            else
              echo "Trying /tmp search..."
              APK_FILE=$(find /tmp -type f -name "app-release.apk" 2>/dev/null | grep "eas-build-local-nodejs" | head -1)

              if [ -n "$APK_FILE" ]; then
                echo "Found APK in /tmp: $APK_FILE"
                cp "$APK_FILE" "build-artifacts/termix_android.apk"
              else
                echo "ERROR: APK not found after build"
                find . -maxdepth 1 \( -name '*.apk' -o -name 'build-*' \)
              fi
            fi

            if [ "$PROFILE" = "production" ]; then
              AAB_FILE=$(find . -maxdepth 1 -type f -name "build-*.aab" 2>/dev/null | head -1)

              if [ -n "$AAB_FILE" ]; then
                cp "$AAB_FILE" "build-artifacts/termix_android.aab"
              else
                AAB_FILE=$(find /tmp -type f -name "app-release.aab" 2>/dev/null | grep "eas-build-local-nodejs" | head -1)
                if [ -n "$AAB_FILE" ]; then
                  echo "Found AAB in /tmp: $AAB_FILE"
                  cp "$AAB_FILE" "build-artifacts/termix_android.aab"
                fi
              fi
            fi
          elif [ "$PLATFORM" = "apple" ]; then
            echo "Searching for iOS build artifacts..."

            IPA_FILE=$(find . -maxdepth 1 -type f -name "build-*.ipa" 2>/dev/null | head -1)

            if [ -n "$IPA_FILE" ]; then
              echo "Found IPA in project root: $IPA_FILE"
              cp "$IPA_FILE" "build-artifacts/termix_ios.ipa"
              echo "Copied to build-artifacts/termix_ios_universal_${VERSION}.ipa"
            else
              IPA_FILE=$(find . -type f -name "*.ipa" -not -path "*/node_modules/*" 2>/dev/null | head -1)

              if [ -n "$IPA_FILE" ]; then
                echo "Found IPA: $IPA_FILE"
                cp "$IPA_FILE" "build-artifacts/termix_ios.ipa"
              else
                echo "ERROR: IPA not found after build"
                find . -maxdepth 1 \( -name '*.ipa' -o -name 'build-*' \)
              fi
            fi
          fi
        env:
          EAS_SKIP_AUTO_FINGERPRINT: 1
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          ASC_API_KEY: ${{ secrets.EXPO_ASC_API_KEY_P8 }}

      - name: Verify build artifacts
        id: detect-artifacts
        run: |
          echo "=== Build Artifacts ==="

          if [ -d "build-artifacts" ]; then
            echo "Contents of build-artifacts/:"
            ls -lh build-artifacts/ 2>/dev/null || echo "Directory exists but is empty"

            ARTIFACT_COUNT=$(find build-artifacts -mindepth 1 -maxdepth 1 | wc -l)
            echo ""
            echo "Total artifacts: $ARTIFACT_COUNT"
          else
            echo "Warning: build-artifacts directory not found"
            mkdir -p build-artifacts
            ARTIFACT_COUNT=0
          fi

          echo "artifact_count=$ARTIFACT_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Android AAB
        if: ${{ github.event.inputs.action == 'submit' && matrix.platform == 'android' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termix_android_aab
          path: build-artifacts/termix_android.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Submit to App Store
        if: ${{ github.event.inputs.action == 'submit' }}
        env:
          SUBMIT_PROFILE: ${{ inputs.channel == 'beta' && 'beta' || 'production' }}
        run: |
          if [ "$PLATFORM" = "android" ]; then
            BUILD_FILE="build-artifacts/termix_android.aab"
            if [ -f "$BUILD_FILE" ]; then
              echo "Using AAB for Play Store submission: $BUILD_FILE"
            else
              echo "ERROR: AAB not found for production submission"
              echo "Play Store requires AAB format for submissions"
              exit 1
            fi
          else
            BUILD_FILE="build-artifacts/termix_ios.ipa"
          fi

          if [ -n "$BUILD_FILE" ] && [ -f "$BUILD_FILE" ]; then
            echo "Submitting file: $BUILD_FILE"
            eas submit -p "$EAS_PLATFORM" --profile "$SUBMIT_PROFILE" --path "$BUILD_FILE" --non-interactive
          else
            echo "No build file found to submit"
            exit 1
          fi

      - name: Upload Android APK
        if: ${{ github.event.inputs.action == 'file' && matrix.platform == 'android' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termix_android
          path: build-artifacts/termix_android.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload iOS IPA
        if: ${{ github.event.inputs.action == 'file' && matrix.platform == 'apple' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termix_ios_universal
          path: build-artifacts/termix_ios.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.action == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ "$PLATFORM" = "android" ]; then
            FILE="build-artifacts/termix_android.apk"
          else
            FILE="build-artifacts/termix_ios.ipa"
          fi

          if [ ! -f "$FILE" ]; then
            echo "ERROR: build file not found: $FILE"
            exit 1
          fi

          echo "Uploading $FILE to $TAG"
          gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish the GitHub release
    needs: [release, build]
    if: ${{ github.event.inputs.action == 'release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Drafts, uploads and publishes this repo's GitHub release.
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
