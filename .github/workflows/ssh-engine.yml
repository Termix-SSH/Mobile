name: SSH engine

on:
  push:
    branches: [main, "dev-*"]
    paths:
      - "modules/termix-ssh/**"
      - "scripts/fetch-ssh-engine.cjs"
      - ".github/workflows/ssh-engine.yml"
  pull_request:
    paths:
      - "modules/termix-ssh/**"
      - "scripts/fetch-ssh-engine.cjs"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the engine as a GitHub release (termix-ssh-v<version>)
        type: boolean
        default: false

concurrency:
  group: ssh-engine-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: modules/termix-ssh

permissions: {}

jobs:
  test:
    name: Rust scenarios
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      BIG_MB: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            modules/termix-ssh/rust
            modules/termix-ssh/bindgen
      - name: Start test servers
        run: |
          docker compose -f test-server/compose.yml up -d --build
          until docker compose -f test-server/compose.yml exec -T target test -f /data/big.sha256; do sleep 2; done
          sudo chmod -R a+r test-server/out
      - name: Scenarios
        working-directory: modules/termix-ssh/rust
        run: SSH_TEST_DOCKER=1 cargo test --release -- --nocapture
      - name: Bindings are current
        run: |
          sh scripts/gen-bindings.sh
          git diff --exit-code -- android/src/main/java/uniffi ios/Generated \
            || (echo "Run modules/termix-ssh/scripts/gen-bindings.sh and commit the result." && exit 1)

  android:
    name: Build Android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      # A published engine is built without a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.publish }}
        with:
          workspaces: modules/termix-ssh/rust
      - name: Tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - run: sh scripts/build-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-android
          path: modules/termix-ssh/dist/termix-ssh-android.tar.gz

  ios:
    name: Build iOS
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      # A published engine is built without a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.publish }}
        with:
          workspaces: |
            modules/termix-ssh/rust
            modules/termix-ssh/bindgen
      - run: sh scripts/build-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-ios
          path: modules/termix-ssh/dist/termix-ssh-ios.tar.gz

  publish:
    name: Publish release
    if: inputs.publish
    needs: [test, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: engine-*
          merge-multiple: true
          path: modules/termix-ssh/dist
      - name: Lock file
        run: node scripts/write-lock.cjs dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "require('./dist/engine.lock.json').tag")
          # Releases are immutable: a published version is never replaced.
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "false" ]; then
            echo "::error::$tag is already published. Bump the engine version."
            exit 1
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "SSH engine $tag" \
            --notes "Prebuilt russh engine for modules/termix-ssh. Not an app release." \
            dist/termix-ssh-android.tar.gz dist/termix-ssh-ios.tar.gz dist/engine.lock.json
          count=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [ "$count" != "3" ]; then
            echo "::error::$tag has $count files, expected 3"
            exit 1
          fi
          gh release edit "$tag" --draft=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-lock
          path: modules/termix-ssh/dist/engine.lock.json
