name: F-Droid check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "dev-*"
    paths:
      - ".github/workflows/fdroid-check.yml"
      - "app.config.js"
      - "plugins/withFdroid.js"
      - "scripts/*fdroid*"
      - "scripts/native-hashes.sh"
      - "modules/termix-ssh/rust/**"
      - "modules/termix-ssh/scripts/build-android.sh"
      - "modules/termix-terminal/ghostty.lock.json"

permissions: {}

jobs:
  build:
    name: F-Droid build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      TERMIX_FDROID: "1"
      # Same as the F-Droid arm64-v8a APK
      TERMIX_FDROID_VERCODE: "200002"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs on release tags, so no caches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - run: npm ci
      - run: node scripts/prepare-fdroid.cjs
      - run: node scripts/check-fdroid.cjs
      - run: sh scripts/build-native-fdroid.sh fetch

      - name: Build the native libraries twice and compare
        run: |
          sh scripts/build-native-fdroid.sh build
          sh scripts/native-hashes.sh > hashes-1.txt
          sh scripts/build-native-fdroid.sh build
          sh scripts/native-hashes.sh > hashes-2.txt
          cat hashes-1.txt
          diff hashes-1.txt hashes-2.txt

      - run: npx expo prebuild --platform android --no-install

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: No Play Services or ML Kit in the APK
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../deps.txt
          ./gradlew :app:dependencyInsight --configuration releaseRuntimeClasspath             --dependency com.google.android.gms:play-services-code-scanner | head -40 || true
          ./gradlew :app:dependencyInsight --configuration releaseRuntimeClasspath             --dependency com.google.mlkit:barcode-scanning | head -40 || true
          cd ..
          node scripts/check-fdroid.cjs deps.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termix-fdroid-unsigned
          path: android/app/build/outputs/apk/release/*.apk
