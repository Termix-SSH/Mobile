name: F-Droid check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: F-Droid build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      TERMIX_FDROID: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Tools
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - run: npm ci
      - run: node scripts/prepare-fdroid.cjs
      - run: node scripts/check-fdroid.cjs
      - run: sh scripts/build-native-fdroid.sh
      - run: npx expo prebuild --platform android --no-install

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: No Play Services or ML Kit in the APK
        working-directory: android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../deps.txt
          cd ..
          node scripts/check-fdroid.cjs deps.txt

      - uses: actions/upload-artifact@v4
        with:
          name: termix-fdroid-unsigned
          path: android/app/build/outputs/apk/release/*.apk
