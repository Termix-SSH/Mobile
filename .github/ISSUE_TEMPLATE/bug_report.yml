name: Bug report
description: Something in the mobile app is broken
labels: [bug]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A maintainer reads every issue, even when there is no reply right away. We usually reply once there is a fix or a workaround.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As few steps as you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app settings.
      placeholder: "e.g. 1.4.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "iOS"
        - "iPadOS"
        - "Android"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "e.g. Pixel 8, Android 15"
    validations:
      required: false
  - type: input
    id: termix-version
    attributes:
      label: Termix server version
      description: The server the app connects to.
      placeholder: "e.g. 26.10.0"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from the browser console, `docker logs termix`, or the error Termix shows. This is shown as code, so no backticks needed.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, config, or anything that might help.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues and this is not a duplicate
          required: true
        - label: I am on the latest version, or I said which version I am on
          required: true
