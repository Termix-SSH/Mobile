plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.termixfold'
version = '0.1.0'

android {
  namespace "expo.modules.termixfold"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.window:window:1.3.0"
  implementation "androidx.window:window-java:1.3.0"
}
