plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.termixterminalnative'
version = '0.1.0'

android {
  namespace "expo.modules.termixterminalnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // The emulator touches android.util only for OSC 52 and logging.
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.annotation:annotation:1.9.1"
  testImplementation "junit:junit:4.13.2"
}
